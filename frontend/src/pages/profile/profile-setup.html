<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriGuard AI | Profile Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="../landing.html"><span class="brand-dot"></span> NutriGuard AI</a>
      <nav class="menu">
        <a class="active" href="./profile-setup.html">Profile Setup</a>
        <a href="../placeholders/dashboard.html">Dashboard</a>
        <a href="../placeholders/bmi-calculator.html">BMI Calculator</a>
        <a href="../placeholders/nutrition-plan.html">Nutrition Plan</a>
        <a href="../placeholders/daily-meal-plan.html">Daily Meal Plan</a>
        <a href="../placeholders/progress-tracking.html">Progress Tracking</a>
        <a href="../placeholders/ai-chat-assistant.html">AI Chat Assistant</a>
        <a href="../placeholders/food-search.html">Food Search</a>
        <a href="../placeholders/notifications.html">Notifications</a>
      </nav>
    </aside>
    <main class="main">
      <h2>Profile Setup (Health Data Form)</h2>
      <p class="lead">This page is fully designed for initial onboarding.</p>
      <div class="card">
        <div class="grid-2">
          <div class="field"><label>Age</label><input id="age" class="input" type="number" value="31"></div>
          <div class="field"><label>Gender</label><select id="gender"><option value="female">Female</option><option value="male">Male</option></select></div>
          <div class="field"><label>Height (cm)</label><input id="heightCm" class="input" type="number" value="168"></div>
          <div class="field"><label>Weight (kg)</label><input id="weightKg" class="input" type="number" value="72"></div>
          <div class="field"><label>Activity Level</label><select id="activityLevel"><option value="moderate">Moderate</option><option value="sedentary">Sedentary</option><option value="active">Active</option><option value="extra_active">Extra Active</option></select></div>
          <div class="field"><label>Goal</label><select id="goal"><option value="weight_loss">Weight Loss</option><option value="maintain">Maintain weight</option><option value="weight_gain">Weight Gain</option><option value="improve_health">Improve health conditions</option></select></div>
        </div>
        <h3 style="margin-top:12px;">Health Conditions</h3>
        <div class="grid-3">
          <label><input id="condHighBp" type="checkbox" checked> High BP</label>
          <label><input id="condDiabetes" type="checkbox"> Diabetes</label>
          <label><input id="condHighCholesterol" type="checkbox"> High Cholesterol</label>
          <label><input id="condLowBp" type="checkbox"> Low BP</label>
          <label><input id="condAnemia" type="checkbox"> Anemia</label>
          <label><input id="condAllergy" type="checkbox"> Allergy</label>
        </div>
        <button id="saveProfileBtn" class="btn primary" style="margin-top:14px;">Save Profile</button>
        <div id="statusBox"></div>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var API_BASE = "http://localhost:8080";
      var token = localStorage.getItem("ng_token");
      var statusBox = document.getElementById("statusBox");

      function setStatus(message, isError) {
        statusBox.className = "status " + (isError ? "err" : "ok");
        statusBox.textContent = message;
      }

      function profilePayload() {
        return {
          age: parseInt(document.getElementById("age").value, 10),
          gender: document.getElementById("gender").value,
          height_cm: parseFloat(document.getElementById("heightCm").value),
          weight_kg: parseFloat(document.getElementById("weightKg").value),
          activity_level: document.getElementById("activityLevel").value,
          goal: document.getElementById("goal").value,
          health_metadata: {
            high_bp: document.getElementById("condHighBp").checked,
            diabetes: document.getElementById("condDiabetes").checked,
            high_cholesterol: document.getElementById("condHighCholesterol").checked,
            low_bp: document.getElementById("condLowBp").checked,
            anemia: document.getElementById("condAnemia").checked,
            allergy: document.getElementById("condAllergy").checked
          }
        };
      }

      async function loadProfile() {
        if (!token) {
          setStatus("Please login first. Redirecting to login...", true);
          setTimeout(function () { window.location.href = "../auth/login.html"; }, 900);
          return;
        }
        try {
          var res = await fetch(API_BASE + "/api/profile", {
            headers: { "Authorization": "Bearer " + token }
          });
          if (res.status === 404) {
            setStatus("No profile yet. Fill form and save.", false);
            return;
          }
          if (!res.ok) {
            throw new Error(await res.text());
          }
          var data = await res.json();
          document.getElementById("age").value = data.age || 31;
          document.getElementById("gender").value = data.gender || "female";
          document.getElementById("heightCm").value = data.height_cm || 168;
          document.getElementById("weightKg").value = data.weight_kg || 72;
          document.getElementById("activityLevel").value = data.activity_level || "moderate";
          document.getElementById("goal").value = data.goal || "maintain";

          var health = data.health_metadata || {};
          document.getElementById("condHighBp").checked = !!health.high_bp;
          document.getElementById("condDiabetes").checked = !!health.diabetes;
          document.getElementById("condHighCholesterol").checked = !!health.high_cholesterol;
          document.getElementById("condLowBp").checked = !!health.low_bp;
          document.getElementById("condAnemia").checked = !!health.anemia;
          document.getElementById("condAllergy").checked = !!health.allergy;

          setStatus("Profile loaded.", false);
        } catch (err) {
          setStatus("Failed to load profile: " + err.message, true);
        }
      }

      document.getElementById("saveProfileBtn").addEventListener("click", async function () {
        if (!token) {
          setStatus("Login required before saving profile.", true);
          return;
        }
        try {
          var res = await fetch(API_BASE + "/api/profile", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify(profilePayload())
          });
          var text = await res.text();
          if (!res.ok) {
            throw new Error(text || "Failed to save profile");
          }
          setStatus("Profile saved successfully.", false);
        } catch (err) {
          setStatus(err.message, true);
        }
      });

      loadProfile();
    })();
  </script>
</body>
</html>
