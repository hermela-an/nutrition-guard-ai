<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriGuard AI | Profile Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="../landing.html"><span class="brand-dot"></span> NutriGuard AI</a>
      <nav class="menu">
        <a class="active" href="./profile-setup.html">Profile Setup</a>
        <a href="../placeholders/dashboard.html">Dashboard</a>
        <a href="../placeholders/bmi-calculator.html">BMI Calculator</a>
        <a href="../placeholders/nutrition-plan.html">Nutrition Plan</a>
        <a href="../placeholders/daily-meal-plan.html">Daily Meal Plan</a>
        <a href="../placeholders/progress-tracking.html">Progress Tracking</a>
        <a href="../placeholders/ai-chat-assistant.html">AI Chat Assistant</a>
        <a href="../placeholders/food-search.html">Food Search</a>
        <a href="../placeholders/notifications.html">Notifications</a>
      </nav>
    </aside>
    <main class="main">
      <h2>Profile Setup (Health Data Form)</h2>
      <p class="lead">This page is fully designed for initial onboarding.</p>
      <div class="card">
        <div class="grid-2">
          <div class="field"><label>Age</label><input class="input" type="number" value="31"></div>
          <div class="field"><label>Gender</label><select><option>Female</option><option>Male</option></select></div>
          <div class="field"><label>Height (cm)</label><input class="input" type="number" value="168"></div>
          <div class="field"><label>Weight (kg)</label><input class="input" type="number" value="72"></div>
          <div class="field"><label>Activity Level</label><select><option>Moderate</option><option>Sedentary</option><option>Active</option></select></div>
          <div class="field"><label>Goal</label><select><option>Weight Loss</option><option>Maintain weight</option><option>Weight Gain</option><option>Improve health conditions</option></select></div>
        </div>
        <h3 style="margin-top:12px;">Health Conditions</h3>
        <div class="grid-3">
          <label><input type="checkbox" checked> High BP</label>
          <label><input type="checkbox"> Diabetes</label>
          <label><input type="checkbox"> High Cholesterol</label>
          <label><input type="checkbox"> Low BP</label>
          <label><input type="checkbox"> Anemia</label>
          <label><input type="checkbox"> Allergy</label>
        </div>
        <button class="btn primary" style="margin-top:14px;">Save Profile</button>
      </div>
    </main>
  </div>
</body>
</html>
