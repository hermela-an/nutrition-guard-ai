<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriGuard AI | Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/assets/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-shell">
      <aside class="auth-side">
        <a class="brand" href="../landing.html" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
        <h2 style="margin-top:30px;">Create your account.</h2>
        <p>Start with onboarding and build your health profile in a few steps.</p>
      </aside>
      <div class="auth-form">
        <h2>Sign Up</h2>
        <p class="lead">Create your secure profile.</p>
        <form>
          <div class="field"><label>Full Name</label><input class="input" type="text" placeholder="Hermela"></div>
          <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com"></div>
          <div class="field"><label>Password</label><input class="input" type="password" placeholder="********"></div>
          <button class="btn primary" type="button" style="width:100%; margin-top:8px;">Create Account</button>
        </form>
        <p style="margin-top:12px; color:var(--muted);">Already have an account? <a href="./login.html" style="color:var(--brand); font-weight:700;">Login</a></p>
      </div>
    </section>
  </main>
</body>
</html>
