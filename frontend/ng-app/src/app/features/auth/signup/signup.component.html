
  <main class="auth-wrap">
    <section class="auth-shell">
      <aside class="auth-side">
        <a class="brand" [routerLink]="auth.isAuthenticated() ? '/dashboard' : '/'" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
        <h2 style="margin-top:30px;">Create your account.</h2>
        <p>Start with onboarding and build your health profile in a few steps.</p>
      </aside>
      <div class="auth-form">
        <h2>Sign Up</h2>
        <p class="lead">Create your secure profile.</p>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="field">
            <label>Full Name</label>
            <input class="input" formControlName="fullName" type="text" placeholder="Hermela">
          </div>
          <div class="field">
            <label>Email</label>
            <input class="input auth-credential" [class.invalid]="isInvalid('email')" formControlName="email" type="email" autocomplete="email" placeholder="you@example.com">
            <small class="error" *ngIf="showError('email', 'required')">Email is required.</small>
            <small class="error" *ngIf="showError('email', 'email')">Invalid email format.</small>
          </div>
          <div class="field">
            <label>Password</label>
            <div class="spaced" style="align-items:stretch;">
              <input class="input auth-credential" [class.invalid]="isInvalid('password')" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="********">
              <button
                class="icon-btn"
                type="button"
                (click)="togglePassword()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [title]="showPassword ? 'Hide password' : 'Show password'">
                <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg *ngIf="showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="m3 3 18 18" fill="none" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M10.6 6.4A11.7 11.7 0 0 1 12 6c6.5 0 10.5 6 10.5 6a16 16 0 0 1-4 4.9M6.1 9A16.9 16.9 0 0 0 1.5 12s4 7 10.5 7a10 10 0 0 0 4-.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
            <small class="error" *ngIf="showError('password', 'required')">Password is required.</small>
            <small class="error" *ngIf="showError('password', 'minlength')">Password must be at least 6 characters.</small>
          </div>
          <button class="btn primary" [disabled]="loading || form.invalid" type="submit" style="width:100%; margin-top:8px;">
          <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
        </form>

        <div *ngIf="status" class="auth-alert" [class.alert-success]="messageType === 'success'" [class.alert-warning]="messageType === 'warning'" [class.alert-error]="messageType === 'error'" role="alert">
          <span class="alert-icon">
            <svg *ngIf="messageType === 'success'" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.8"/><path d="m6 10 3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg *ngIf="messageType === 'warning'" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M9.13 3.23a1 1 0 0 1 1.74 0l6.54 11.34A1 1 0 0 1 16.54 16H3.46a1 1 0 0 1-.87-1.43Z" stroke="currentColor" stroke-width="1.8"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="13.5" r=".75" fill="currentColor"/></svg>
            <svg *ngIf="messageType === 'error'" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.8"/><path d="m7 7 6 6M13 7l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="alert-text">{{ status }}</span>
        </div>

        <button
          *ngIf="showResend"
          class="btn secondary"
          type="button"
          (click)="resendVerification()"
          [disabled]="loading"
          style="width:100%; margin-top:10px;">
          Resend verification email
        </button>

        <p style="margin-top:12px; color:var(--muted);">Already have an account? <a routerLink="/login" style="color:var(--brand); font-weight:700;">Login</a></p>
      </div>
    </section>
  </main>
