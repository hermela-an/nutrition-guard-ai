<main class="auth-wrap">
  <section class="auth-shell">
    <aside class="auth-side">
      <a class="brand" [routerLink]="auth.isAuthenticated() ? '/dashboard' : '/'" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
      <h2 style="margin-top:30px;">Verify your email.</h2>
      <p>This helps keep your account secure.</p>
    </aside>
    <div class="auth-form">
      <h2>Email Verification</h2>
      <p class="lead">Activating your account…</p>

      <div *ngIf="loading" class="status">Verifying…</div>
      <div *ngIf="!loading && status" class="status" [class.ok]="!error" [class.err]="error">{{ status }}</div>

      <div style="margin-top:12px;">
        <a routerLink="/login" style="color:var(--brand); font-weight:700;">Back to login</a>
      </div>
    </div>
  </section>
</main>
