<main class="auth-wrap">
  <section class="auth-shell">
    <aside class="auth-side">
      <a class="brand" [routerLink]="auth.isAuthenticated() ? '/dashboard' : '/'" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
      <h2 style="margin-top:30px;">Reset your password.</h2>
      <p>Enter your email to receive a reset link (if an account exists).</p>
    </aside>
    <div class="auth-form">
      <h2>Forgot Password</h2>
      <p class="lead">We'll send a time-limited reset link.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Email</label>
          <input class="input auth-credential" [class.invalid]="isInvalid()" [readonly]="loading" formControlName="email" type="email" autocomplete="email" placeholder="you@example.com">
          <small class="error" *ngIf="showError('required')">Email is required.</small>
          <small class="error" *ngIf="showError('email')">Invalid email format.</small>
        </div>
        <button class="btn primary" [disabled]="loading" type="submit" style="width:100%; margin-top:8px;">
          <span class="btn-inner">
            <span *ngIf="loading" class="btn-spinner" aria-hidden="true"></span>
            <span>{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
          </span>
        </button>
      </form>
      <div *ngIf="status" class="status" [class.ok]="success" [class.err]="error" [class.info]="!success && !error" role="status" aria-live="polite">
        <div>{{ status }}</div>
        <div *ngIf="success" class="status-actions">
          <button class="btn ghost small" type="button" (click)="submit()" [disabled]="loading">Resend</button>
          <button class="btn ghost small" type="button" (click)="resetMessage()" [disabled]="loading">Use different email</button>
        </div>
      </div>
      <p style="margin-top:12px; color:var(--muted);"><a routerLink="/login" style="color:var(--brand); font-weight:700;">Back to login</a></p>
    </div>
  </section>
</main>
