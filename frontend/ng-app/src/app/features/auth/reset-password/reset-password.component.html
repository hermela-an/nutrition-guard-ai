<main class="auth-wrap">
  <section class="auth-shell">
    <aside class="auth-side">
      <a class="brand" [routerLink]="auth.isAuthenticated() ? '/dashboard' : '/'" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
      <h2 style="margin-top:30px;">Choose a new password.</h2>
      <p>This link expires shortly for your security.</p>
    </aside>
    <div class="auth-form">
      <h2>Reset Password</h2>
      <p class="lead">Create a new password for your account.</p>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="field">
            <label>New Password</label>
            <div class="spaced" style="align-items:stretch;">
              <input class="input auth-credential" [class.invalid]="isInvalid('password')" [readonly]="loading" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="********">
              <button
                class="icon-btn"
                type="button"
                (click)="togglePassword()"
                [disabled]="loading"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [title]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="m3 3 18 18" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M10.6 6.4A11.7 11.7 0 0 1 12 6c6.5 0 10.5 6 10.5 6a16 16 0 0 1-4 4.9M6.1 9A16.9 16.9 0 0 0 1.5 12s4 7 10.5 7a10 10 0 0 0 4-.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
          <small class="error" *ngIf="showError('password', 'required')">Password is required.</small>
          <small class="error" *ngIf="showError('password', 'minlength')">Password must be at least 6 characters.</small>
        </div>

          <div class="field">
            <label>Confirm Password</label>
            <input class="input auth-credential" [class.invalid]="isInvalid('confirmPassword')" [readonly]="loading" formControlName="confirmPassword" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="********">
            <small class="error" *ngIf="showError('confirmPassword', 'required')">Confirmation is required.</small>
            <small class="error" *ngIf="showError('confirmPassword', 'minlength')">Password must be at least 6 characters.</small>
          </div>

          <button class="btn primary" [disabled]="loading" type="submit" style="width:100%; margin-top:8px;">
            <span class="btn-inner">
              <span *ngIf="loading" class="btn-spinner" aria-hidden="true"></span>
              <span>{{ loading ? 'Updating...' : 'Update Password' }}</span>
            </span>
          </button>
        </form>
      <div *ngIf="status" class="status" [class.ok]="!error" [class.err]="error">{{ status }}</div>
      <p style="margin-top:12px; color:var(--muted);"><a routerLink="/login" style="color:var(--brand); font-weight:700;">Back to login</a></p>
    </div>
  </section>
</main>
