services:
  postgres:
    image: postgres:16
    container_name: nutritionguard-postgres
    environment:
      POSTGRES_DB: nutritionguard
      POSTGRES_USER: nutritionguard
      POSTGRES_PASSWORD: nutritionguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/docker-init/000_run_all.sh:/docker-entrypoint-initdb.d/000_run_all.sh
      - ./database/migrations:/ng-init/migrations:ro
      - ./database/seed:/ng-init/seed:ro

volumes:
  pgdata:
