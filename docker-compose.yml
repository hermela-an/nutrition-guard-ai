services:
  postgres:
    image: postgres:16
    container_name: nutritionguard-postgres
    environment:
      POSTGRES_DB: nutritionguard
      POSTGRES_USER: nutritionguard
      POSTGRES_PASSWORD: nutritionguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/seed/001_food_items.sql:/docker-entrypoint-initdb.d/002_food_items.sql

volumes:
  pgdata:
