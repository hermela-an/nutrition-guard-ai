services:
  postgres:
    image: postgres:16
    container_name: nutritionguard-postgres
    environment:
      POSTGRES_DB: nutritionguard
      POSTGRES_USER: nutritionguard
      POSTGRES_PASSWORD: nutritionguard
      # Seeds are opt-in to avoid auto-inserting large food lists into an existing dev DB.
      # Set to "1" only when you intentionally want to load `database/seed/*.sql`.
      NUTRITIONGUARD_RUN_SEEDS: "0"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/docker-init/000_run_all.sh:/docker-entrypoint-initdb.d/000_run_all.sh
      - ./database/migrations:/ng-init/migrations:ro
      - ./database/seed:/ng-init/seed:ro

volumes:
  pgdata:
