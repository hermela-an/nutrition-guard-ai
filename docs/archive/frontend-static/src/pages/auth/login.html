<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriGuard AI | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/assets/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-shell">
      <aside class="auth-side">
        <a class="brand" href="../landing.html" style="color:#fff;"><span class="brand-dot"></span> NutriGuard AI</a>
        <h2 style="margin-top:30px;">Welcome back.</h2>
        <p>Log in to access your medically-aware dashboard and nutrition plan.</p>
      </aside>
      <div class="auth-form">
        <h2>Login</h2>
        <p class="lead">Secure access to your profile.</p>
        <form id="loginForm">
          <div class="field"><label>Email</label><input id="email" class="input" type="email" placeholder="you@example.com" required></div>
          <div class="field"><label>Password</label><input id="password" class="input" type="password" placeholder="********" required></div>
          <button id="loginBtn" class="btn primary" type="submit" style="width:100%; margin-top:8px;">Login</button>
        </form>
        <div id="statusBox"></div>
        <p style="margin-top:12px; color:var(--muted);">No account? <a href="./signup.html" style="color:var(--brand); font-weight:700;">Sign up</a></p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var API_BASE = "http://localhost:8080";
      var form = document.getElementById("loginForm");
      var btn = document.getElementById("loginBtn");
      var statusBox = document.getElementById("statusBox");

      function setStatus(message, isError) {
        statusBox.className = "status " + (isError ? "err" : "ok");
        statusBox.textContent = message;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        btn.disabled = true;
        statusBox.className = "";
        statusBox.textContent = "";
        try {
          var payload = {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          };
          var res = await fetch(API_BASE + "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          var text = await res.text();
          if (!res.ok) {
            throw new Error(text || "Login failed");
          }
          var data = JSON.parse(text);
          localStorage.setItem("ng_token", data.token);
          localStorage.setItem("ng_user", JSON.stringify(data.user));
          setStatus("Login successful. Redirecting to dashboard...", false);
          setTimeout(function () {
            window.location.href = "../placeholders/dashboard.html";
          }, 700);
        } catch (err) {
          setStatus(err.message, true);
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
